services:
  postgres:
    image: postgres:17-alpine
    container_name: cham-code-db
    environment:
      POSTGRES_USER: chamcode
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: ChamCodeDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamcode -d ChamCodeDB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_NAME: ChamCodeDB
      DB_USER: chamcode
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    command: sh -c "python scripts/init_db.py && alembic upgrade head"

volumes:
  postgres_data: