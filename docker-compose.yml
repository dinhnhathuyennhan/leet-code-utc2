services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cham-code-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: ChamCodeDB
      DB_USER: sa
      DB_PASSWORD: "${MSSQL_SA_PASSWORD}"
    command: sh -c "python scripts/init_db.py && alembic upgrade head"

volumes:
  sqlserver_data: