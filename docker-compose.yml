services:
  postgres:
    image: postgres:17-alpine
    container_name: cham-code-db
    environment:
      POSTGRES_USER: chamcode
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: ChamCodeDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamcode -d ChamCodeDB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_NAME: ChamCodeDB
      DB_USER: chamcode
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
    command: sh -c "python scripts/init_db.py && alembic upgrade head"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cham-code-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chamcode.com
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin123}"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  # ---------- Judge0 CE (chấm code) ----------
  # Cấu hình nằm ở judge0.conf. DB và Redis riêng cho Judge0, không dùng chung với DB của app.
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: cham-code-judge0-server
    privileged: true # isolate (sandbox) cần quyền này
    ports:
      - "127.0.0.1:2358:2358"
    env_file: ./judge0.conf
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null http://localhost:2358/about || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: cham-code-judge0-workers
    command: ["./scripts/workers"]
    privileged: true
    env_file: ./judge0.conf
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    container_name: cham-code-judge0-db
    env_file: ./judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    container_name: cham-code-judge0-redis
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"
    env_file: ./judge0.conf
    volumes:
      - judge0_redis_data:/data
    restart: unless-stopped
volumes:
  postgres_data:
  pgadmin_data:
  judge0_data:
  judge0_redis_data: